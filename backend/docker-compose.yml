version: '3.8'

services:
  # --- Infrastructure ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rideverse-net
    healthcheck:
      test: ["CMD", "nc", "-z", "zookeeper", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - rideverse-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s # Increased interval for kafka-topics command
      timeout: 10s
      retries: 5

  redis:
    image: redis:latest
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --notify-keyspace-events Ex
    networks:
      - rideverse-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    hostname: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - rideverse-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- GUI Tools ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-new
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - rideverse-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8001:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - rideverse-net

  # --- Application Services ---
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3005:3005"
    environment:
      AUTH_SERVICE_MONGODB_URI: mongodb://mongo:27017/auth_service
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForJWT} # Use env var or default
      AUTH_SERVICE_PORT: 3005
      USER_SERVICE_URL: http://user-service:3006 # Added dependency
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./auth-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "3006:3006"
    environment:
      USER_SERVICE_MONGODB_URI: mongodb://mongo:27017/user_service
      DRIVER_SERVICE_URL: http://driver-service:3001 # Added dependency
      KAFKA_BROKERS: kafka:9092
      AUTH_SERVICE_URL: http://auth-service:3005 # Added dependency
      USER_SERVICE_PORT: 3006
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./user-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  ride-service:
    build:
      context: ./ride-service
      dockerfile: Dockerfile
    container_name: ride-service
    ports:
      - "3000:3000"
    environment:
      RIDE_SERVICE_MONGODB_URI: mongodb://mongo:27017/ride_service
      DRIVER_SERVICE_URL: http://driver-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      RIDE_SERVICE_PORT: 3000
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./ride-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  driver-service:
    build:
      context: ./driver-service
      dockerfile: Dockerfile
    container_name: driver-service
    ports:
      - "3001:3001"
    environment:
      DRIVER_SERVICE_MONGODB_URI: mongodb://mongo:27017/driver_service
      RIDE_SERVICE_URL: http://ride-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      DRIVER_SERVICE_PORT: 3001
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./driver-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "3002:3002"
    environment:
      NOTIFICATION_SERVICE_MONGODB_URI: mongodb://mongo:27017/notification_service # Can be removed if not storing state
      RIDE_SERVICE_URL: http://ride-service:3000
      DRIVER_SERVICE_URL: http://driver-service:3001
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NOTIFICATION_SERVICE_PORT: 3002
      NODE_OPTIONS: --experimental-modules
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./notification-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  location-service:
    build:
      context: ./location-service
      dockerfile: Dockerfile
    container_name: location-service
    ports:
      - "3003:3003"
    environment:
      LOCATION_SERVICE_MONGODB_URI: mongodb://mongo:27017/location_service
      DRIVER_SERVICE_MONGODB_URI: mongodb://mongo:27017/driver_service # For updating driver model
      REDIS_URL: redis://redis:6379
      LOCATION_SERVICE_PORT: 3003
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./location-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "3004:3004"
    environment:
      PAYMENT_SERVICE_MONGODB_URI: mongodb://mongo:27017/payment_service
      KAFKA_BROKERS: kafka:9092
      PAYMENT_SERVICE_PORT: 3004
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_SIMULATED} # Use env var or default simulated key
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./payment-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  support-service:
    build:
      context: ./support-service
      dockerfile: Dockerfile
    container_name: support-service
    ports:
      - "3007:3007"
    environment:
      SUPPORT_SERVICE_MONGODB_URI: mongodb://mongo:27017/support_service
      KAFKA_BROKERS: kafka:9092
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
      SUPPORT_SERVICE_PORT: 3007
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./support-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - "3008:3008"
    environment:
      ANALYTICS_SERVICE_MONGODB_URI: mongodb://mongo:27017/analytics_service
      KAFKA_BROKERS: kafka:9092
      RIDE_SERVICE_URL: http://ride-service:3000 # To apply surge pricing
      NOTIFICATION_SERVICE_URL: http://notification-service:3002 # To notify surge
      ANALYTICS_SERVICE_PORT: 3008
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rideverse-net
    volumes:
      - ./analytics-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: admin-service
    ports:
      - "3009:3009"
    environment:
      ADMIN_SERVICE_MONGODB_URI: mongodb://mongo:27017/admin_service
      RIDE_SERVICE_URL: http://ride-service:3000
      DRIVER_SERVICE_URL: http://driver-service:3001
      USER_SERVICE_URL: http://user-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3004
      SUPPORT_SERVICE_URL: http://support-service:3007
      ANALYTICS_SERVICE_URL: http://analytics-service:3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVICE_PORT: 3009
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForJWT} # Same secret as Auth Service
      ADMIN_DEFAULT_USER: ${ADMIN_DEFAULT_USER:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-password}
      NODE_OPTIONS: --experimental-modules
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Depend on other services it interacts with directly
      ride-service:
        condition: service_started # Use service_started for API dependencies
      driver-service:
        condition: service_started
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
      support-service:
        condition: service_started
      analytics-service:
        condition: service_started
    networks:
      - rideverse-net
    volumes:
      - ./admin-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs # Volume for logs

  # --- Admin Portal Frontend ---
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    container_name: admin-portal
    ports:
      - "5173:5173" # Vite default dev port
    environment:
      VITE_ADMIN_SERVICE_URL: http://admin-service:3009 # URL for backend API
      NODE_ENV: development
    depends_on:
      - admin-service # Depends on its backend
    networks:
      - rideverse-net
    volumes:
      - ./admin-portal:/app
      - /app/node_modules
    # Command to run Vite dev server
    command: npm run dev -- --host 0.0.0.0

networks:
  rideverse-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  # Shared logs volume (optional, can be useful)
  # rideverse-logs:

